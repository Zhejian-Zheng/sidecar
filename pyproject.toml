[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sidecar-phone-agent"
version = "0.1.0"
description = "A device-independent GUI agent harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "langchain-openai>=1,<2",
  "pydantic>=2.10,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx>=0.28,<1"]
android = ["uiautomator2>=3.2,<4"]

[project.scripts]
sidecar = "sidecar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
