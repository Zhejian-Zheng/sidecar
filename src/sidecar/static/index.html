<!doctype html>
<html lang="zh-CN">
<!-- 页面元信息及本地样式、脚本入口；不引入第三方前端资源。 --><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1767D2"><title>Sidecar 伴行</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body>
<!-- 顶部品牌与执行端连接状态。 --><header><a href="/" class="brand"><span class="mark">S</span><strong>Sidecar <span>伴行</span></strong></a><span id="connection" role="status">尚未连接</span></header>
<main>
<!-- 首次连接：输入 Mac 执行端显示的配对码。 --><section id="pairing"><h1>把任务交给伴行。</h1><p>连接你的执行端，查看任务、处理交接。</p><form id="pair-form"><label for="token">配对码</label><input id="token" type="password" autocomplete="off" required placeholder="输入 Mac 上显示的配对码"><button>连接 Sidecar</button></form></section>
<!-- 鉴权成功后显示的主控制台，默认隐藏。 --><div id="console" hidden>
<div class="intro"><div><h1>你继续，伴行来处理。</h1><p id="mode-note"></p></div><button id="disconnect" class="quiet">断开连接</button></div>
<!-- 任务状态变化的页面内提示，不是 iPhone 系统通知。 --><div id="notice" role="status" hidden></div>
<div class="workspace">
<!-- 左侧任务区：目标输入、演示待办或完成标准，以及历史任务。 --><aside><section class="compose"><h2>交给伴行的事</h2><form id="task-form"><label for="goal">任务描述</label><textarea id="goal" rows="3" maxlength="4000" required placeholder="例如：创建面试准备清单，并添加整理项目与录制演示两项任务"></textarea><div id="demo-input"><label for="items">演示待办，每行一项</label><textarea id="items" rows="3" placeholder="整理项目 README&#10;录制演示视频"></textarea></div><div id="criteria-input" hidden><label for="criteria">完成标准（可选，每行一条）</label><textarea id="criteria" rows="2" placeholder="留空时由模型从任务中提取"></textarea></div><button id="submit">提交任务</button><p class="hint">离开页面不影响后台执行。Mac 与执行设备需要保持运行。</p></form></section><section class="tasks"><h2>我的任务</h2><div id="task-list"><p class="hint">还没有任务。从上方开始。</p></div></section></aside>
<!-- 执行详情：最近截图、动作记录和完成证据。 --><section class="execution"><div class="execution-head"><h2 id="task-title">执行现场</h2><span id="task-status" class="badge">等待任务</span></div><p id="reason" class="hint">提交任务后，在这里查看进度和结果。</p><div class="execution-body"><div class="screen"><img id="frame" alt="设备最近一次观察画面" hidden><div id="frame-empty"><span class="screen-icon">▤</span><p>等待观察画面</p><small>真实设备任务将显示最近截图<br>离线演示仅显示文字记录</small></div></div><div class="details"><h3>执行记录</h3><ol id="events"></ol><div id="evidence"></div></div></div><!-- 运行中的控制入口：请求暂停或取消，并等待后台确认。 --><div id="controls" hidden><button id="pause" class="secondary">暂停并接管</button><button id="cancel" class="quiet danger">取消任务</button></div><!-- 人工交接入口：核对现场并填写说明后继续任务。 --><form id="resume-form" hidden><label for="note">核对现场后，交还给伴行</label><input id="note" maxlength="1000" required placeholder="例如：已完成登录，请继续"><button>继续执行</button></form></section>
</div><!-- 明确当前通知能力，避免将页面提示误认为后台推送。 --><footer>当前提供页面内完成提示与任务记录。关闭页面后的 iPhone 系统推送尚未接入。</footer>
</div><!-- 统一错误区域，供脚本显示可理解的失败原因。 --><p id="error" role="alert" hidden></p>
</main></body></html>
